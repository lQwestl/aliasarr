name: Docker Publish

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    # Образ публикуется только из кода, прошедшего тесты: раньше в latest
    # уходила любая сборка main, даже с упавшим тестом.
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python scripts/run_tests.py

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU нужен только при мультиплатформенной сборке (main и релизные теги v*).
      # Для веток feature/** эмуляция отключается для максимальной скорости сборки.
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Check and Ensure Base Image
        run: |
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:3.11"
          echo "BASE_TAG=${BASE_TAG}" >> $GITHUB_ENV
          if docker manifest inspect "${BASE_TAG}" > /dev/null 2>&1; then
            echo ">>> Base image ${BASE_TAG} exists in registry. Skipping base build."
            echo "NEED_BASE_BUILD=false" >> $GITHUB_ENV
          else
            echo ">>> Base image ${BASE_TAG} NOT found in registry. Will build base image first."
            echo "NEED_BASE_BUILD=true" >> $GITHUB_ENV
          fi

      - name: Build and push Base Image (Bootstrap)
        if: env.NEED_BASE_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          platforms: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.BASE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base:buildcache,mode=max

      - name: Build local image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: aliasarr-smoke:test
          build-args: |
            BASE_IMAGE=${{ env.BASE_TAG }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha

      - name: Run container smoke test
        run: |
          docker run -d --name smoke-test -p 8989:8989 aliasarr-smoke:test
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8989/api/v1/health > /dev/null 2>&1; then
              echo ">>> Container health check passed successfully!"
              docker logs smoke-test
              docker rm -f smoke-test
              exit 0
            fi
            sleep 1
          done
          echo ">>> ERROR: Container health check failed to respond after 30s!"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_TAG }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
